plugins {
    id 'com.android.application'
}

android {
    namespace 'com.asoft.ios'
    compileSdk 36
    ndkVersion '29.0.13846066'
    defaultConfig {
        applicationId 'com.asoft.ios'
        minSdk 29
        targetSdk 35
        versionCode 7
        versionName '0.1.5'
        ndk { abiFilters 'arm64-v8a' }
    }
    // The release key stays out of the repository: a properties file (storeFile, storePassword,
    // keyAlias, keyPassword) at $ASOFT_SIGNING, else ~/.android/asoft-ios-release.properties.
    // Without it the release APK is unsigned.
    def signingProps = new Properties()
    def signingFile = file(System.getenv('ASOFT_SIGNING') ?: "${System.getProperty('user.home')}/.android/asoft-ios-release.properties")
    if (signingFile.exists()) {
        signingFile.withInputStream { signingProps.load(it) }
    }
    signingConfigs {
        if (signingProps.storeFile) {
            release {
                storeFile file(signingProps.storeFile)
                storePassword signingProps.storePassword
                keyAlias signingProps.keyAlias
                keyPassword signingProps.keyPassword
            }
        }
    }
    // iOS 26's QEMU (the NDK build with reims), Turnip and the Vulkan loader: pull-libs26.sh,
    // apart from pull-libs.sh's jniLibs (which it empties)
    sourceSets {
        main { jniLibs.srcDirs = ['src/main/jniLibs', 'src/main/jniLibs26'] }
    }
    buildTypes {
        // the test services and the screen take adb's intents in a debug build only
        debug {
            manifestPlaceholders = [testExported: 'true']
            // -PasoftDev: com.asoft.ios.dev, installed beside the release app and its iPhone
            if (project.hasProperty('asoftDev')) {
                applicationIdSuffix '.dev'
                versionNameSuffix '-dev'
            }
        }
        release {
            manifestPlaceholders = [testExported: 'false']
            if (signingProps.storeFile) {
                signingConfig signingConfigs.release
            }
        }
    }
    // A call newer than minSdk closes the app on older Androids (0.1.3 and before: readAllBytes on
    // Android 10 to 12): it fails the release build
    lint {
        fatal 'NewApi'
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
    // the helper VM's kernels and initramfs (pull-setup.sh: *.gz.bin) are gzip already: stored, so the
    // app reads their length without unpacking them (AssetManager.openFd)
    androidResources {
        noCompress += ['bin']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // libqemu.so is an executable and lib_*.so its libraries: they must be real files in
    // nativeLibraryDir, the one place an app may exec from, and stay as they were built.
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/*.so']
        }
    }
}

dependencies {
    // TLS 1.3 with exported keying material, for the pairing with Wireless debugging (AdbTls); Apache-2.0
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    // the JVM tests of what has no Android in it (CrashTextTest)
    testImplementation 'junit:junit:4.13.2'
}
